<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="grid-bg">
  <main style="max-width: var(--page-max-width); margin: 0 auto; padding: var(--spacing-40) var(--spacing-24);">
