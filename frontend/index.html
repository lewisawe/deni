<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deni — know the real cost before you borrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="grid-bg">
  <header style="border-bottom:1px solid var(--color-carbon-black);background:var(--color-paper-white);">
    <div style="max-width:var(--page-max-width);margin:0 auto;padding:var(--spacing-16) var(--spacing-24);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-family:var(--font-geist-mono);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Deni</span>
      <span style="font-family:var(--font-geist-mono);font-size:var(--text-caption);">Know the real cost before you borrow</span>
    </div>
  </header>

  <main style="max-width:760px;margin:0 auto;padding:var(--spacing-40) var(--spacing-24);">
    <h1 style="font-size:var(--text-heading-lg);font-weight:600;letter-spacing:-0.03em;line-height:1.1;margin:0 0 var(--spacing-16);">
      What will this loan <span style="color:var(--color-signal-orange);">really</span> cost you?
    </h1>
    <p style="max-width:52ch;margin:0 0 var(--spacing-24);">
      Pick a loan you're considering. Deni shows the true cost, whether the lender is licensed,
      and what they can take if you miss a payment.
    </p>

    <label for="product" style="display:block;font-weight:600;margin-bottom:var(--spacing-8);">Choose a loan</label>
    <select id="product" style="width:100%;padding:12px;border:1px solid var(--color-carbon-black);border-radius:var(--radius-smallbuttons);font-size:var(--text-body);font-family:var(--font-geist);background:var(--color-paper-white);">
      <option value="">Loading…</option>
    </select>

    <div id="result" style="margin-top:var(--spacing-32);" aria-live="polite"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
